project:
  type: website
  output-dir: _site
  # The site's pages are .qmd files; the repository's own Markdown (README, CONTRIBUTING) is not.
  render:
    - "*.qmd"
    - "notes/*.qmd"
    - "notes/*/index.qmd"
    - "library/index.qmd"
    - "library/*/index.qmd"
# A note's numbers are made from its logs by `uv run python scripts/note_numbers.py`, and the Library's
# pages from its entries by `uv run python scripts/library.py build`; the build runs both before
# rendering. Neither is a Quarto pre-render script, because Quarto reads a page's included files
# before any pre-render script runs.

website:
  title: haau3 Research
  description: Open research on caregiving, with and without AI.
  site-url: https://research.haau3.com
  repo-url: https://github.com/haau3/research
  # For search: link previews when a page is shared, and each page's one true address (canonical-url,
  # under html). Google Scholar's tags are switched on in each note, so other pages never look like papers.
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: notes/index.qmd
        text: Notes
      - href: library/index.qmd
        text: Library
      - href: about.qmd
        text: About
    tools:
      - icon: github
        href: https://github.com/haau3/research
        aria-label: The source on GitHub
  page-footer:
    left: |
      Copyright 2026 Brian K. Fung Media LLC, doing business as haau3.
    right: |
      Writing and data [CC BY 4.0](https://github.com/haau3/research/blob/main/LICENSE-CC-BY-4.0).
      Code [MIT](https://github.com/haau3/research/blob/main/LICENSE).

# Code runs on the computer that writes a page, never in the build: its results are stored in
# _freeze/ and committed beside the page.
execute:
  freeze: auto

lang: en

format:
  html:
    theme:
      light: [brand, brand/light.scss, brand/site.scss]
      dark: [brand, brand/dark.scss, brand/site.scss]
    respect-user-color-scheme: true
    # Quarto's highlight styles made to meet WCAG contrast, one for each colour mode.
    highlight-style:
      light: a11y
      dark: a11y-dark
    toc: false
    smooth-scroll: false
    canonical-url: true
