[project]
name = "research"
version = "0.0.0"
description = "The site at research.haau3.com: open research on caregiving, with and without AI."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
# Quarto builds the site. Its version is pinned here and locked in uv.lock, so the laptop and the
# workflow build with the same one: `uv run quarto render`. jsonschema checks every Library entry
# against CSL's own schema before the Library's pages are built (scripts/library.py).
dev = [
  "quarto-cli==1.11.9",
  "jsonschema==4.26.0",
]
# Inspect reads the run logs when the site builds: every number on a note is computed from them.
notes = ["inspect-ai==0.3.291"]
# What runs an evaluation, on the laptop only (`uv sync --group harness`): Inspect's ready-made
# evaluations, the two providers' SDKs, and mlx-lm, which serves an open-weight model on Apple
# Silicon. The build never installs these.
harness = [
  "inspect-evals[healthbench]==0.29.0",
  "anthropic==2.12.0",
  "openai==3.57.0",
  "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# What drafts the Library's entries (`uv sync --group library`): Anthropic's SDK, on the laptop and in
# the monthly search workflow. The build never installs it.
library = ["anthropic==2.12.0"]

[tool.uv]
package = false
required-version = ">=0.11.8"
default-groups = ["dev", "notes"]
# Nothing is installed in its first three days on PyPI, the same wait Dependabot keeps, and it holds
# for every package in the lock, not only the ones named here.
exclude-newer = "3 days"
# quarto-cli asks for Jupyter (about a hundred packages) so that Quarto can run code. The site runs
# none when it builds: each page's results are stored by `freeze` on the computer that ran it. This
# removes the three packages wherever they are asked for, so the first page whose code needs one of
# them takes it off this list.
exclude-dependencies = ["jupyter", "nbclient", "wheel"]
