name: Pages

# A merge to main builds the site with the same checks as a pull request, then publishes it to
# GitHub Pages at research.haau3.com. The build has no write access; only the publishing job may
# write to Pages, and only from main (the github-pages environment's rule).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One publish at a time, and a newer one never cancels a publish already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Numbers
        run: uv run python scripts/note_numbers.py
      - name: Library
        run: uv run python scripts/library.py build
      - name: Render
        run: uv run quarto render
      - name: Body text is 16 px or more
        run: python3 -I scripts/check_text_size.py _site
      - name: Headless Chrome
        run: uv run quarto install chrome-headless-shell --no-prompt
      - name: Accessibility
        run: uv run quarto call axe _site --fail-on minor
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
