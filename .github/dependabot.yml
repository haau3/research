# Dependabot keeps the toolchain current: Quarto (through uv.lock) every Monday, the GitHub Actions
# once a month, each waiting three days after a release. A maintainer merges every PR.
version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    groups:
      uv:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:00"
      timezone: America/New_York
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
